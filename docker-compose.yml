services:
  db:
    image: postgis/postgis:16-3.4
    container_name: naksha_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # DEV-ONLY DEFAULTS: Override in .env for non-development environments
      POSTGRES_USER: ${POSTGRES_USER:-naksha_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-naksha_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-naksha}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naksha_dev} -d ${POSTGRES_DB:-naksha}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
    name: naksha_pgdata
